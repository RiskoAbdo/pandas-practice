<style>
/* Recoleta is licensed: read from the viewer's machine only; everyone else gets Fraunces. */
@font-face { font-family: "Recoleta"; font-weight: 600; src: local("Recoleta SemiBold"), local("Recoleta-SemiBold"); }

/* Occulenz tokens. Layout: deep-teal bar on top, a three-column board of challenge cards, and a challenge panel that slides in from the right.
   Spacing scale 8 / 16 / 24 / 32 only. Card radius 14, inputs 10, controls are pills 36 px high with 18 px icons centred. */
:root {
  --bg: #FFFFFF; --surface: #E5F4F5; --surface-strong: #C0E5E7; --card: #FFFFFF;
  --text: #002A2C; --muted: #1D5659; --border: #C0E5E7; --border-strong: #9AD7DA;
  --primary: #2A7A7E; --primary-hover: #1D5659; --on-primary: #FFFFFF; --accent: #CDA474; --accent-text: #7E572A; --focus: #A37138;
  --ok: #2A7A7E; --warn: #7E572A; --warn-soft: #F5EEE5; --bad: #A33868; --bad-soft: #F5E5EC;
  --glow-in: rgba(205,164,116,.16); --glow-rim: rgba(205,164,116,.6); --glow-out: rgba(205,164,116,.12);
  --stripe-a: #2A7A7E; --stripe-b: #4EBBC1; --scrim: rgba(0,20,22,.45);
  --shadow-1: 0 1px 2px rgba(0,42,44,.06), 0 2px 8px rgba(0,42,44,.06);
  --shadow-2: 0 24px 60px rgba(0,42,44,.22);
  /* The bar and the editor stay deep teal in both themes. */
  --band: #002A2C; --band-ink: #E5F4F5; --band-muted: #9AD7DA; --band-line: #0F4A4D;
  --code-bg: #002A2C; --code-ink: #E5F4F5; --code-line: #04383B;
  --hero-a: #0F4A4D; --hero-b: #04383B; --hero-c: #002A2C;
  --s1: 8px; --s2: 16px; --s3: 24px; --s4: 32px;
  --display: "Recoleta", "Fraunces", Georgia, serif;
  --ui: "Poppins", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --band-h: 64px;
  color-scheme: light;
}
/* Dark: the same teal hue as teal-950, pushed much deeper. */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000C0D; --surface: #00191B; --surface-strong: #022628; --card: #001416;
  --text: #E5F4F5; --muted: #9AD7DA; --border: #04282A; --border-strong: #0F4A4D;
  --primary: #74C9CD; --primary-hover: #9AD7DA; --on-primary: #002A2C; --accent: #E7D5C0; --accent-text: #DABC9A; --focus: #CDA474;
  --ok: #74C9CD; --warn: #DABC9A; --warn-soft: #2C1800; --bad: #DA9AB7; --bad-soft: #2C0014;
  --glow-in: rgba(205,164,116,.30); --glow-rim: rgba(231,213,192,.65); --glow-out: rgba(205,164,116,.22);
  --stripe-a: #389EA3; --stripe-b: #74C9CD; --scrim: rgba(0,0,0,.6);
  --shadow-1: 0 1px 2px rgba(0,0,0,.5); --shadow-2: 0 24px 60px rgba(0,0,0,.6);
  --band: #000C0D; --band-line: #04282A; --code-bg: #000607; --code-line: #00191B;
  --hero-a: #083A3D; --hero-b: #012022; --hero-c: #000E0F;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #000C0D; --surface: #00191B; --surface-strong: #022628; --card: #001416;
  --text: #E5F4F5; --muted: #9AD7DA; --border: #04282A; --border-strong: #0F4A4D;
  --primary: #74C9CD; --primary-hover: #9AD7DA; --on-primary: #002A2C; --accent: #E7D5C0; --accent-text: #DABC9A; --focus: #CDA474;
  --ok: #74C9CD; --warn: #DABC9A; --warn-soft: #2C1800; --bad: #DA9AB7; --bad-soft: #2C0014;
  --glow-in: rgba(205,164,116,.30); --glow-rim: rgba(231,213,192,.65); --glow-out: rgba(205,164,116,.22);
  --stripe-a: #389EA3; --stripe-b: #74C9CD; --scrim: rgba(0,0,0,.6);
  --shadow-1: 0 1px 2px rgba(0,0,0,.5); --shadow-2: 0 24px 60px rgba(0,0,0,.6);
  --band: #000C0D; --band-line: #04282A; --code-bg: #000607; --code-line: #00191B;
  --hero-a: #083A3D; --hero-b: #012022; --hero-c: #000E0F;
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 var(--ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--band); z-index: 40; }
.gx { padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
@media (max-width: 600px) { .gx { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }
.wrap { max-width: 1280px; margin: 0 auto; }
h1, h2, h3 { margin: 0; line-height: 1.2; font-weight: 600; text-wrap: balance; }
p { margin: 0; }
code, pre { font-family: var(--mono); }
code { font-size: .86em; background: var(--surface); color: var(--text); padding: 1px 6px; border-radius: 5px; overflow-wrap: anywhere; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.key { font-family: var(--display); font-weight: 600; letter-spacing: -.01em; }
.muted { color: var(--muted); }
.lab { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.logo-light { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo-dark { display: none; } :root:not([data-theme="light"]) .logo-light { display: block; } }
:root[data-theme="dark"] .logo-dark { display: none; }
:root[data-theme="dark"] .logo-light { display: block; }

/* Icons and buttons: every control centres its content on both axes. */
.i { width: 18px; height: 18px; display: block; flex: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--card); color: var(--text); font: 500 13.5px/1 var(--ui); white-space: nowrap; cursor: pointer; transition: background-color .15s, border-color .15s; }
.btn:hover:not(:disabled) { background: var(--surface); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.p { background: var(--primary); border-color: var(--primary); color: var(--on-primary); font-weight: 600; }
.btn.p:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--surface); }
.btn.amber { background: #CDA474; border-color: #CDA474; color: #002A2C; font-weight: 600; }
.btn.amber:hover:not(:disabled) { background: #DABC9A; border-color: #DABC9A; }
.btn.lg { height: 44px; font-size: 14.5px; }
.ibtn { width: 36px; height: 36px; padding: 0; border-radius: 50%; display: inline-grid; place-items: center; border: 1px solid var(--border-strong); background: var(--card); color: var(--text); cursor: pointer; flex: none; }
.ibtn:hover { background: var(--surface); }

/* Bar */
.band { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--band); color: var(--band-ink); border-bottom: 1px solid var(--band-line); }
.band-in { display: flex; align-items: center; gap: var(--s2); height: var(--band-h); }
.band :focus-visible { outline-color: #CDA474; }
.band .logo { height: 28px; width: auto; display: block; }
.band.quiz .logo { height: 24px; }
.band .vr { width: 1px; height: 28px; background: var(--band-line); flex: none; }
.band .bt { display: flex; flex-direction: column; justify-content: center; line-height: 1.25; min-width: 0; }
.band .bt b { font-weight: 600; font-size: 14px; white-space: nowrap; }
.band .bt span { color: var(--band-muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.band .sp { flex: 1; }
.band .btn:not(.amber), .band .ibtn { background: rgba(229,244,245,.06); border-color: var(--band-line); color: var(--band-ink); }
.clock { display: flex; align-items: center; gap: var(--s1); }
.clock svg { width: 32px; height: 32px; transform: rotate(-90deg); flex: none; }
.clock .trk { stroke: #0F4A4D; }
.clock .arc { stroke: #74C9CD; transition: stroke-dashoffset .4s linear, stroke .3s; }
.clock .txt { display: flex; flex-direction: column; justify-content: center; line-height: 1.1; }
.clock .txt span { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--band-muted); }
.clock .txt b { font: 600 20px/1.1 var(--mono); font-variant-numeric: tabular-nums; }
.band.warn .arc { stroke: #CDA474; } .band.warn .clock b { color: #DABC9A; }
.band.crit .arc { stroke: #DA9AB7; } .band.crit .clock b { color: #DA9AB7; }
@media (prefers-reduced-motion: no-preference) { .band.crit .clock b { animation: pulse 1s ease-in-out infinite; } @keyframes pulse { 50% { opacity: .5; } } }
.band.untimed .clock svg { display: none; }
.tsw { display: inline-flex; align-items: center; padding: 3px; gap: 2px; border-radius: 999px; border: 1px solid var(--band-line); background: rgba(229,244,245,.06); }
.tsw button { width: 32px; height: 28px; border: 0; border-radius: 999px; display: grid; place-items: center; background: transparent; color: var(--band-muted); cursor: pointer; padding: 0; }
.tsw button[aria-pressed="true"] { background: #0F4A4D; color: var(--band-ink); }
.tsw .i { width: 16px; height: 16px; }
@media (max-width: 720px) { .band .vr, .band.quiz .logo { display: none; } .clock .txt span { display: none; } }
@media (max-width: 560px) { .band .bt { display: none !important; } .band-in { gap: var(--s1); } .clock svg { width: 26px; height: 26px; } .clock .txt b { font-size: 17px; } }
.notice { position: fixed; z-index: 35; left: 50%; top: calc(env(safe-area-inset-top, 0px) + var(--band-h) + 16px); transform: translateX(-50%); display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 20px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); border: 1px solid var(--accent); font-weight: 500; font-size: 13.5px; box-shadow: var(--shadow-2); white-space: nowrap; }

/* Shared marks */
.st { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; font: 600 11px/1 var(--ui); flex: none; background: var(--surface); color: var(--muted); font-variant-numeric: tabular-nums; }
.st .i { width: 14px; height: 14px; }
.st.ok { background: var(--ok); color: var(--on-primary); }
.st.half { background: var(--warn-soft); color: var(--warn); box-shadow: inset 0 0 0 1.5px var(--accent); }
.st.no { background: var(--bad-soft); color: var(--bad); box-shadow: inset 0 0 0 1.5px var(--bad); }
.st.cur { background: var(--card); color: var(--text); box-shadow: inset 0 0 0 2px var(--primary); }
.chip { display: inline-flex; align-items: center; height: 24px; font: 600 11.5px/1 var(--ui); padding: 0 10px; border-radius: 999px; background: var(--surface); color: var(--muted); white-space: nowrap; }
.chip.rule { background: var(--warn-soft); color: var(--warn); }
.glow { border: 1px solid var(--glow-rim) !important; background: radial-gradient(120% 90% at 50% 130%, var(--glow-in), transparent 70%), var(--card) !important; box-shadow: 0 10px 30px -8px var(--glow-out), inset 0 1px 0 rgba(255,255,255,.06) !important; }
.stripes { background: repeating-linear-gradient(-55deg, var(--stripe-a) 0 8px, var(--stripe-b) 8px 16px); }
.bign { display: inline-flex; align-items: baseline; font: 600 28px/1 var(--display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.bign small { font: 500 12.5px/1 var(--ui); color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; }

/* Start */
.start { display: grid; gap: var(--s3); grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); padding-block: var(--s4); }
@media (max-width: 960px) { .start { grid-template-columns: minmax(0, 1fr); } }
.hero { position: relative; overflow: hidden; border-radius: 20px; padding: var(--s4); background: radial-gradient(120% 140% at 0% 0%, var(--hero-a), var(--hero-b) 40%, var(--hero-c)); border: 1px solid var(--border); color: #E5F4F5; display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: var(--s3); align-items: center; }
.hero-txt { display: grid; gap: var(--s2); align-content: start; }
.hero .eyebrow { color: #9AD7DA; }
.hero h1 { font-size: clamp(34px, 4.6vw, 52px); letter-spacing: -.02em; }
.hero p { color: #C0E5E7; max-width: 46ch; }
.hero .ring { width: 200px; height: auto; display: block; justify-self: end; }
@media (max-width: 640px) { .hero { grid-template-columns: minmax(0, 1fr); } .hero .ring { display: none; } }
.facts { display: flex; gap: var(--s1); flex-wrap: wrap; margin-top: var(--s1); }
.fact { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 999px; background: rgba(229,244,245,.07); border: 1px solid rgba(154,215,218,.22); }
.fact b { font: 600 20px/1 var(--display); color: #E5F4F5; display: block; transform: translateY(1px); }
.fact span { font: 400 13px/1 var(--ui); color: #9AD7DA; display: block; }
.fact.amber b { color: #DABC9A; }
.side { display: grid; gap: var(--s2); align-content: start; }
.form { padding: var(--s3); display: grid; gap: var(--s3); }
.form h2 { font-size: 20px; }
.field { display: grid; gap: var(--s1); }
.field input[type="text"] { height: 44px; padding: 0 var(--s2); border-radius: 10px; border: 1px solid var(--border-strong); background: var(--bg); width: 100%; }
.field input[type="text"]:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--surface-strong); }
.seg { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--s1); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px 4px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--bg); cursor: pointer; text-align: center; }
.seg label b { font: 600 18px/1 var(--display); }
.seg label small { font: 400 11px/1 var(--ui); color: var(--muted); }
.seg input:checked + label { border-color: var(--primary); background: var(--surface); box-shadow: inset 0 0 0 1px var(--primary); }
.seg input:focus-visible + label { outline: 2px solid var(--focus); outline-offset: 2px; }
.status { display: flex; align-items: center; gap: var(--s1); font-size: 12.5px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.dot.ok { background: var(--ok); } .dot.err { background: var(--bad); }
.errtext { color: var(--bad); font-size: 13px; }
.errtext:empty { display: none; }
.resume { padding: var(--s3); display: grid; gap: var(--s2); border-color: var(--accent); background: var(--warn-soft); }
.row { display: flex; flex-wrap: wrap; gap: var(--s1); align-items: center; }
.steps { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s3); }
@media (max-width: 760px) { .steps { grid-template-columns: minmax(0, 1fr); } }
.step { padding: var(--s3); display: grid; gap: var(--s1); align-content: start; }
.step .ico { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--primary); margin-bottom: var(--s1); }
.step b { font-weight: 600; font-size: 15px; }
.step p { font-size: 14px; color: var(--muted); }
.sign { display: flex; align-items: center; gap: var(--s2); padding-block: var(--s3) var(--s4); color: var(--muted); font-size: 13.5px; }
.sign img { height: 22px; width: auto; }
.sign .line { flex: 1; height: 1px; background: var(--border-strong); }
.sign b { font-weight: 600; color: var(--text); }

/* Board */
.strip { display: flex; align-items: center; gap: var(--s3); padding-block: var(--s2); border-bottom: 1px solid var(--border); }
.strip .bar { flex: 1; height: 10px; border-radius: 5px; background: var(--surface); overflow: hidden; }
.strip .bar i { display: block; height: 100%; border-radius: 5px; transition: width .4s; }
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s3); padding-block: var(--s3) var(--s4); align-items: start; }
@media (max-width: 900px) { .board { grid-template-columns: minmax(0, 1fr); } }
.col { border-radius: 14px; background: var(--surface); padding: var(--s2); display: grid; gap: var(--s1); }
.col-h { display: flex; align-items: center; gap: var(--s1); height: 32px; font-weight: 600; font-size: 14px; }
.col-h i { width: 10px; height: 10px; border-radius: 50%; display: block; }
.col-h span { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 500; }
.col-sub { padding: var(--s1) 0 0; }
.col-empty { border: 1.5px dashed var(--border-strong); border-radius: 12px; padding: var(--s2); text-align: center; color: var(--muted); font-size: 12.5px; }
.tc { width: 100%; text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px var(--s2); display: grid; gap: var(--s1); cursor: pointer; color: var(--text); transition: border-color .15s, transform .1s; }
.tc:hover { border-color: var(--border-strong); }
.tc:active { transform: translateY(1px); }
.tc .r { display: flex; align-items: center; gap: 12px; min-width: 0; }
.tc .r b { flex: 1; min-width: 0; font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tc .r small { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tc .r2 { display: flex; align-items: center; gap: var(--s1); min-width: 0; }
.tbar { flex: 1; display: flex; gap: 3px; min-width: 40px; }
.tbar i { flex: 1; height: 4px; border-radius: 2px; background: var(--border); }
.tbar i.p { background: var(--ok); } .tbar i.f { background: var(--bad); }
.draft { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--accent-text); }
.draft::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

/* Challenge panel */
/* The challenge opens centred over the board; the bar (timer, Submit) stays visible above it. Click outside to go back. */
.scrim { position: fixed; inset: 0; z-index: 20; background: var(--scrim); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.sheet { position: fixed; z-index: 25; top: calc(env(safe-area-inset-top, 0px) + var(--band-h) + 24px); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); width: min(1560px, calc(100% - 64px)); background: var(--bg); border: 1px solid var(--border-strong); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow-2); display: flex; flex-direction: column; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: popin .2s ease-out; } @keyframes popin { from { transform: translateX(-50%) scale(.98); opacity: 0; } } }
@media (max-width: 1100px) { .sheet { top: calc(env(safe-area-inset-top, 0px) + var(--band-h)); bottom: 0; left: 0; transform: none; width: 100%; border-radius: 0; border: 0; } @keyframes popin { from { opacity: 0; } } }
.sheet-h { display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s3); min-height: 64px; border-bottom: 1px solid var(--border); background: var(--card); flex: none; flex-wrap: wrap; padding-block: 12px; }
.sheet-h h2 { font-size: 18px; flex: 1; min-width: 120px; }
.sheet-h .sep { width: 1px; height: 24px; background: var(--border); }
.sheet-b { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(360px, 5fr) minmax(0, 7fr); gap: var(--s3); padding: var(--s3); overflow: auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
@media (max-width: 900px) { .sheet-b { grid-template-columns: minmax(0, 1fr); } .sheet-h .chip { display: none; } }
@media (max-width: 600px) {
  .sheet-h { flex-wrap: nowrap; gap: var(--s1); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .sheet-h h2 { min-width: 0; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet-h .sep { display: none; }
  #prevBtn, #nextBtn { width: 36px; padding: 0; } #prevBtn .bl, #nextBtn .bl { display: none; }
  .sheet-b { padding: var(--s2); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

}
.instr { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }

.tab { height: 44px; display: inline-flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 0; color: var(--muted); font: 500 13.5px/1 var(--ui); border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; }

/* Solution tab: the code on top, then how to think about it, then every line explained. */
.sol-code { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); border-radius: 12px; background: var(--code-bg); color: var(--code-ink); font: 13px/24px var(--mono); overflow-x: auto; }

.work { display: flex; flex-direction: column; gap: var(--s2); min-width: 0; min-height: 0; }

.t { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); font-size: 13px; align-items: start; }

/* CodeMirror 5 core (inlined, the CDN only serves scripts) */
.CodeMirror { position: relative; overflow: hidden; height: 100%; font-family: var(--mono); font-size: 14px; line-height: 22px; background: var(--code-bg); color: var(--code-ink); direction: ltr; }

.cm-s-occ .cm-keyword { color: #CDA474; font-weight: 500; }

/* Suggestions popup */

/* Dialog, toast, grading */

.marks { display: flex; flex-wrap: wrap; gap: var(--s1); justify-content: center; }

/* Results */
.res { display: grid; gap: var(--s3); padding-block: var(--s4); }
.resgrid { display: grid; gap: var(--s3); grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); }

.marks.left { justify-content: flex-start; }

.topics { display: grid; gap: var(--s2); }

.topics .b { height: 8px; border-radius: 4px; background: var(--surface); overflow: hidden; }

.topics b { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.rq { display: grid; gap: var(--s1); }
details.rqd { background: var(--card); border: 1px solid var(--border); border-radius: 12px; }

.rq-body { padding: 0 var(--s2) var(--s2); display: grid; gap: var(--s2); grid-template-columns: repeat(2, minmax(0, 1fr)); }

@media (max-width: 760px) { .rq-body { grid-template-columns: minmax(0, 1fr); } }
pre.codeblock { margin: 6px 0 0; padding: 12px var(--s2); border-radius: 10px; background: var(--code-bg); color: var(--code-ink); font: 12.5px/1.6 var(--mono); overflow-x: auto; }
.copy { padding: var(--s3); display: grid; gap: var(--s2); }
.copy textarea { width: 100%; min-height: 160px; padding: 12px var(--s2); border-radius: 10px; border: 1px solid var(--border-strong); background: var(--bg); font: 12.5px/1.6 var(--mono); resize: vertical; }

/* SQL additions: result grids, the tables panel, data previews, recommendations. */
.grid-wrap { overflow: auto; max-height: 340px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); }
table.grid { border-collapse: collapse; width: max-content; min-width: 100%; font: 12.5px/1.4 var(--mono); }
table.grid th { position: sticky; top: 0; z-index: 1; background: var(--surface); color: var(--muted); font: 600 11.5px/1.2 var(--ui); text-align: left; padding: 8px 12px; white-space: nowrap; border-bottom: 1px solid var(--border-strong); }

.tbls { display: grid; gap: 12px; }
.tbl { display: grid; gap: 6px; }
.tblrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.vchip.colc { border: 1px solid var(--border-strong); background: var(--card); min-height: 28px; padding: 2px 10px; gap: 6px; }
.vchip.colc b { color: var(--text); font-weight: 500; }
.vchip.colc span.v { font-size: 11px; }
.vchip.tchip { min-height: 30px; }
details.data { border: 1px solid var(--border); border-radius: 10px; background: var(--card); }
details.data summary { cursor: pointer; padding: 0 12px; min-height: 40px; font-weight: 600; font-size: 13px; display: flex; gap: 8px; align-items: center; list-style: none; }
details.data summary::-webkit-details-marker { display: none; }
details.data summary small { font-weight: 400; color: var(--muted); }
details.data summary .chev { margin-left: auto; color: var(--muted); transition: transform .15s; }
details.data[open] summary .chev { transform: rotate(180deg); }
details.data[open] summary { border-bottom: 1px solid var(--border); }
details.data .grid-wrap { border: 0; border-radius: 0 0 10px 10px; max-height: 280px; }
details.data .tnote { padding: 8px 12px 0; font-size: 12.5px; color: var(--muted); }
.cmp .grid-wrap { max-height: 220px; margin-top: 4px; }
.console { max-height: 420px; }
/* Wide tables scroll inside their own box; the instructions never get cut off. */
.instr-b { grid-template-columns: minmax(0, 1fr); }
.instr-b > * { min-width: 0; }
/* Show >= and <> as typed, not joined into one symbol. */
.CodeMirror pre.CodeMirror-line, .CodeMirror pre.CodeMirror-line-like, pre.codeblock, .sol-code, .line code { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
@media (max-width: 900px) { .instr, .work { min-height: auto; overflow: visible; } .instr-b { overflow: visible; } }
.h-badge.k-col { background: #2A7A7E; color: #E5F4F5; }
.h-badge.k-alias { background: transparent; color: #9AD7DA; box-shadow: inset 0 0 0 1px #1D5659; }
.verdict { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px; border-radius: 999px; background: var(--surface); color: var(--text); font: 600 12.5px/1 var(--ui); justify-self: start; }
.verdict i { width: 8px; height: 8px; border-radius: 50%; display: block; }
.recs { display: grid; gap: var(--s2); grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.rec { display: grid; gap: var(--s1); align-content: start; padding: var(--s2); border: 1px solid var(--border); border-radius: 12px; background: var(--card); }
.rec b { font-weight: 600; }
.rec p { font-size: 13.5px; color: var(--muted); }
.rec ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13.5px; }
.rec a { color: var(--primary); text-underline-offset: 3px; }
.rec .pct { font: 600 12px/1 var(--ui); color: var(--warn); }


/* Language switch, stage picker and right-to-left (Arabic). Code, data grids and the editor always stay left-to-right. */
.lsw { display: inline-flex; align-items: center; padding: 3px; gap: 2px; border-radius: 999px; border: 1px solid var(--band-line); background: rgba(229,244,245,.06); }
.lsw button { min-width: 36px; height: 28px; padding: 0 10px; border: 0; border-radius: 999px; display: grid; place-items: center; background: transparent; color: var(--band-muted); cursor: pointer; font: 600 12.5px/1 "Poppins", "Rubik", sans-serif; letter-spacing: 0; }
.lsw button[data-l="ar"] { font-family: "Rubik", sans-serif; font-size: 14px; }
.lsw button[aria-pressed="true"] { background: #0F4A4D; color: var(--band-ink); }
.stagepick { display: grid; gap: var(--s1); grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); }
.stagepick input { position: absolute; opacity: 0; pointer-events: none; }
.stagepick label { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px var(--s2); border-radius: 12px; border: 1px solid var(--border-strong); background: var(--bg); cursor: pointer; }
.stagepick label .sp-no { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--primary); font: 600 17px/1 var(--display); flex: none; }
.stagepick label .sp-t { display: grid; gap: 2px; min-width: 0; }
.stagepick label b { font-weight: 600; font-size: 14.5px; line-height: 1.35; }
.stagepick label small { color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.stagepick input:checked + label { border-color: var(--primary); background: var(--surface); box-shadow: inset 0 0 0 1px var(--primary); }
.stagepick input:focus-visible + label { outline: 2px solid var(--focus); outline-offset: 2px; }
.track { grid-column: 1 / -1; padding: var(--s3); display: grid; gap: var(--s2); }
.track-row { display: flex; flex-wrap: wrap; gap: var(--s1); }
.track-row span { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 6px; border-radius: 999px; background: var(--surface); color: var(--muted); font-size: 13px; }
.track-row span i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--card); font: 600 11px/1 var(--ui); font-style: normal; color: var(--muted); }
.track-row span.on { background: var(--card); color: var(--text); box-shadow: inset 0 0 0 1px var(--primary); }
.track-row span.on i { background: var(--primary); color: var(--on-primary); }
code { unicode-bidi: isolate; }
.lines > *, .line, .think li > span { min-width: 0; }
.line { grid-template-columns: minmax(0, 1fr); }
/* Tables card header is a button that folds the card (used on phones). */
button.vars-h { width: 100%; border: 0; background: none; color: inherit; font: inherit; text-align: start; cursor: default; padding: 0; }
.vars-h .vchev { display: none; }
.vars.folded .tbls { display: none; }
@media (max-width: 900px) {
  button.vars-h { cursor: pointer; min-height: 44px; align-items: center; }
  .vars-h .vchev { display: block; width: 18px; height: 18px; margin-inline-start: auto; flex: none; transition: transform .2s; color: var(--muted); }
  .vars.folded .vchev { transform: rotate(-90deg); }
  :root[dir="rtl"] .vars.folded .vchev { transform: rotate(90deg); }
  .vars.folded .vars-h small { display: none; }
  .vars.folded { padding-top: 6px; padding-bottom: 6px; }
  /* Titles may take two lines instead of being cut. */
  .sheet-h h2 { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; }
  .sheet .ed-f { display: none; }
}
/* Touch screens: every control at least 40-44px, and 16px text in inputs so iOS does not zoom in on focus. */
@media (pointer: coarse) {
  .lsw button, .tsw button { min-width: 40px; height: 36px; }
  .band .btn, .band .ibtn { height: 40px; }
  .sheet-h .btn, .sheet-h .ibtn { min-width: 44px; height: 44px; }
  .tab { min-height: 44px; }
  .vchip { min-height: 38px; }
  .btn { min-height: 44px; }
  input[type="text"], textarea, .CodeMirror textarea { font-size: 16px !important; }
  .CodeMirror-hints { font-size: 15px; max-height: 40vh; }
  .CodeMirror-hint { padding: 9px 10px !important; }
  .stagepick label { min-height: 60px; }
  .res a, .rec a { display: inline-block; padding: 6px 0; }
}
/* Small phones (360-399px): the quiz bar holds the clock, both switches and Submit, so it gets tighter. */
@media (max-width: 399px) {
  .band-in { gap: 6px; }
  .band .clock svg { display: none; }
  .lsw button, .tsw button { min-width: 34px; padding: 0 6px; }
  .lsw, .tsw { padding: 2px; }
  #submitBtn { padding: 0 12px; }
  .tab { padding-left: 10px; padding-right: 10px; }
}
/* Help costs */
.chip.cost0 { background: var(--bad-soft); color: var(--bad); }
.tab .cnt { margin-inline-start: 2px; }
.mistake p { padding: 10px var(--s2); border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: 14px; margin-top: 6px; }
.line code { max-width: 100%; }
.means { margin-top: 6px; padding: 10px var(--s2); border-radius: 10px; background: var(--surface); font-size: 13.5px; color: var(--text); white-space: pre-line; }
.means b { color: var(--primary); font-weight: 600; }
.CodeMirror, .edwrap, .ed-f, .sol-code, pre.codeblock, .errbox, .line code, .grid-wrap, .CodeMirror-hints, .tblrow, code { direction: ltr; }
.errbox.ar { direction: rtl; font-family: var(--ui); }
:root[dir="rtl"] { --ui: "Rubik", "Segoe UI", Tahoma, sans-serif; }
/* The top bar never flips: logo on the left, switches on the right, in both languages. Its own words still read right to left. */
.band, .band-in { direction: ltr; }
.band .bt, .band .clock .txt, #submitBtn { unicode-bidi: plaintext; }
:root[dir="rtl"] .band .bt { text-align: left; }
:root[dir="rtl"] body { line-height: 1.85; }
:root[dir="rtl"] .lab, :root[dir="rtl"] .clock .txt span, :root[dir="rtl"] .key, :root[dir="rtl"] .bign { letter-spacing: 0; }
:root[dir="rtl"] .lab { text-transform: none; font-size: 12.5px; }
:root[dir="rtl"] .hero { background: radial-gradient(120% 140% at 100% 0%, var(--hero-a), var(--hero-b) 40%, var(--hero-c)); }
:root[dir="rtl"] .hero h1 { line-height: 1.35; }
:root[dir="rtl"] .tc, :root[dir="rtl"] .vchip { text-align: right; }
:root[dir="rtl"] .col-h span { margin-left: 0; margin-right: auto; }
:root[dir="rtl"] .fname { margin-right: 0; margin-left: auto; }
:root[dir="rtl"] .instr-b ol, :root[dir="rtl"] .instr-b ul, :root[dir="rtl"] .rec ul { padding-left: 0; padding-right: 20px; }
:root[dir="rtl"] .bign small { margin-left: 0; margin-right: 6px; }
:root[dir="rtl"] .dlist b { margin-left: 0; margin-right: auto; }
:root[dir="rtl"] details.rqd summary .nm small { margin-left: 0; margin-right: 8px; }
:root[dir="rtl"] details.rqd summary .pp, :root[dir="rtl"] .topics b { text-align: left; }
:root[dir="rtl"] details.data summary .chev { margin-left: 0; margin-right: auto; }
:root[dir="rtl"] .sheet .vars-h small { text-align: right; }
:root[dir="rtl"] .grading .inner, :root[dir="rtl"] .toast, :root[dir="rtl"] .notice { direction: rtl; }

/* Results sheet: did the attempt reach the instructor */
.sendbox { padding: var(--s2); flex-wrap: wrap; font-size: 14px; color: inherit; margin-bottom: var(--s2); }
.sendbox > span:nth-child(2) { flex: 1 1 240px; min-width: 0; }
#codeHelp { margin-top: 4px; }


/* pandas track: the index column, the kind line above a result, printed output and plain values. */
.grid th.ix, .grid td.ix { font-weight: 600; color: var(--muted); background: var(--surface); }
.kind { font-size: 12px; color: var(--muted); margin: 8px 0 4px; font-family: "JetBrains Mono", ui-monospace, monospace; }
.valbox, .printed { margin: 4px 0 8px; padding: 8px 16px; border-radius: 10px; background: var(--surface); font: 13px/1.6 "JetBrains Mono", ui-monospace, monospace; white-space: pre-wrap; overflow-x: auto; direction: ltr; text-align: left; }
.given { display: grid; gap: 8px; margin-bottom: 8px; }
.given-code { margin: 0; }
.chip.adv { color: var(--accent); }
</style>


</head>
<body>

</svg>
<header class="band" id="band">
  <div class="band-in wrap gx">
    <img class="logo" src="assets/occulenz-horizontal-light.svg" alt="Occulenz">
    <span class="vr" id="bandVr" hidden></span>
    <span class="bt" id="bandTitle" hidden><b id="bandStage"></b><span id="who"></span></span>
    <span class="sp"></span>
    <div class="clock" id="clock" role="timer" hidden>
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle class="trk" cx="20" cy="20" r="16" fill="none" stroke-width="4"/><circle class="arc" id="clockArc" cx="20" cy="20" r="16" fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="100.53" stroke-dashoffset="0"/></svg>
      <span class="txt"><span id="clockLabel"></span><b id="digits">00:00</b></span>
    </div>
    <div class="lsw" role="group" data-ta="language">
      <button type="button" data-l="en" lang="en">EN</button>
      <button type="button" data-l="ar" lang="ar">ع</button>
    </div>
    <div class="tsw" role="group" data-ta="theme">
      <button type="button" data-t="light" data-ta="light"><svg class="i"><use href="#i-sun"/></svg></button>
      <button type="button" data-t="dark" data-ta="dark"><svg class="i"><use href="#i-moon"/></svg></button>
    </div>
    <button class="btn amber" id="submitBtn" type="button" data-t="submit" hidden></button>
  </div>
</header>
<div class="notice" id="notice" role="status" hidden></div>
<div class="sr" id="live" aria-live="polite"></div>

<main class="wrap gx">
  <!-- Start -->
  <section id="screen-start">
    <div class="start">
      <div class="hero">
        <div class="hero-txt">
          <p class="lab eyebrow" data-t="eyebrow"></p>
          <h1 data-th="heroTitle"></h1>
          <p id="heroLede"></p>
          <div class="facts">
            <span class="fact"><b id="statCount">15</b><span data-t="factQueries"></span></span>
            <span class="fact"><b id="statTime">60</b><span id="statTimeLabel"></span></span>
            <span class="fact amber"><b>100</b><span data-t="factPoints"></span></span>
          </div>
        </div>
        <svg class="ring" viewBox="-4 -4 174 176" aria-hidden="true">
          <defs>
            <filter id="meltBlur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16"/></filter>
            <mask id="meltMask" maskUnits="userSpaceOnUse" x="-60" y="-60" width="300" height="300">
              <rect x="-60" y="-60" width="300" height="300" fill="#fff"/>
              <path d="M-10 40 C 20 70, 30 110, 8 150 C 30 140, 52 112, 50 84 C 48 60, 24 44, -10 40 Z" fill="#000" fill-opacity=".55" filter="url(#meltBlur)"/>
            </mask>
          </defs>
          <g mask="url(#meltMask)" opacity=".85">
            <path fill="#9AD7DA" d="M156.23,102c3.97,1.02,6.28,5.2,4.96,9.08C132.59,195.62-.49,176.16,0,83.09,0,40.2,33.26,4.46,75.19.48c4.18-.4,7.81,2.85,7.81,7.06v14.77c0,3.6-2.71,6.62-6.29,7.04-26.93,3.11-47.85,25.99-47.85,53.75-.53,60.52,85.36,72.84,104.66,19.68,1.25-3.44,4.89-5.37,8.43-4.46l14.27,3.68Z"/>
            <path fill="#CDA474" d="M165.96,83.1c0,2.91-.15,5.81-.46,8.7-.43,4.09-4.26,6.95-8.29,6.14l-14.68-2.93c-3.45-.69-5.89-3.86-5.57-7.36,2.45-27.43-17.37-53.14-44.28-57.84-3.48-.61-5.91-3.78-5.68-7.3l.99-14.93c.27-4.1,4.02-7.06,8.08-6.41,39.68,6.36,69.89,41.06,69.89,81.94Z"/>
            <path fill="#E7D5C0" d="M82.86,55.24l.02.7c.42,14.57,12.14,26.28,26.71,26.71l.7.02-.7.02c-14.57.42-26.28,12.14-26.71,26.71l-.02.7-.02-.7c-.42-14.57-12.14-26.28-26.71-26.71l-.7-.02.7-.02c14.57-.42,26.28-12.14,26.71-26.71l.02-.7Z"/>
          </g>
        </svg>
      </div>
      <div class="side">
        <div class="card resume" id="resume" hidden>
          <div><b id="resumeTitle"></b><p class="muted" id="resumeSub" style="font-size:13.5px"></p></div>
          <div class="row"><button class="btn p" id="resumeBtn" type="button" data-t="resume"></button><button class="btn" id="discardBtn" type="button" data-t="discard"></button></div>
        </div>
        <form class="card form" id="startForm" autocomplete="off">
          <h2 data-t="ready"></h2>
          <div class="field"><span class="lab" id="stageLabel" data-t="chooseStage"></span><div class="stagepick" id="stagePick" role="radiogroup" aria-labelledby="stageLabel"></div></div>
          <div class="field" id="nameField"><label class="lab" for="name" data-t="yourName"></label><input type="text" id="name" maxlength="60" data-tp="namePh"></div>
          <div class="field" id="codeField" hidden><label class="lab" for="code" data-t="yourCode"></label><input type="text" id="code" maxlength="12" dir="ltr" autocapitalize="characters" autocorrect="off" spellcheck="false" data-tp="codePh"><p class="status" id="codeHelp"><span class="dot" id="codeDot"></span><span id="codeText"></span></p></div>
          <div class="field">
            <span class="lab" id="durLabel" data-t="timeLimit"></span>
            <div class="seg" role="radiogroup" aria-labelledby="durLabel">
              <input type="radio" name="dur" id="d30" value="30"><label for="d30"><b>30</b><small data-t="min"></small></label>
              <input type="radio" name="dur" id="d45" value="45"><label for="d45"><b>45</b><small data-t="min"></small></label>
              <input type="radio" name="dur" id="d60" value="60" checked><label for="d60"><b>60</b><small data-t="min"></small></label>
              <input type="radio" name="dur" id="d90" value="90"><label for="d90"><b>90</b><small data-t="min"></small></label>
              <input type="radio" name="dur" id="d0" value="0"><label for="d0"><b>∞</b><small data-t="noTimer"></small></label>
            </div>
            <p class="muted" id="durHelp" style="font-size:12.5px"></p>
          </div>
          <div class="errtext" id="startErr" role="alert"></div>
          <button class="btn p lg" id="startBtn" type="submit" disabled data-t="start"></button>
          <div class="status"><span class="dot" id="engDot"></span><span id="engText"></span></div>
        </form>
      </div>
      <div class="steps">
        <div class="card step"><span class="ico"><svg class="i"><use href="#i-read"/></svg></span><b data-t="step1"></b><p data-t="step1t"></p></div>
        <div class="card step"><span class="ico"><svg class="i"><use href="#i-play"/></svg></span><b data-t="step2"></b><p data-t="step2t"></p></div>
        <div class="card step"><span class="ico"><svg class="i"><use href="#i-check"/></svg></span><b data-t="step3"></b><p data-t="step3t"></p></div>
      </div>
      <div class="card track"><span class="lab" data-t="theTrack"></span><div class="track-row" id="trackRow"></div><p class="muted" style="font-size:13px" data-t="trackNote"></p></div>
    </div>
  </section>

  <!-- Board -->
  <section id="screen-board" hidden>
    <div class="strip">
      <span class="bign" id="solvedNum"></span>
      <span class="bar" aria-hidden="true"><i class="stripes" id="solvedBar" style="width:0"></i></span>
      <span class="bign" id="ptsNum"></span>
    </div>
    <div class="board" id="board"></div>
  </section>

  <!-- Results -->

const PY_TABLES = Object.keys(SCHEMA);

/* One data set as CSV text per table, rows in the given order. */
function toCsv(data, order) {
  const out = {};
  PY_TABLES.forEach((tb) => {
    const cols = SCHEMA[tb].map((c) => c[0]);
    const rows = order ? order(data[tb]) : data[tb];
    const cell = (v) => (v === null || v === undefined ? '' : typeof v === 'string' && /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : String(v));
    out[tb] = [cols.join(',')].concat(rows.map((r) => r.map(cell).join(','))).join('\n') + '\n';
  });
  return out;
}

  PY.worker = new Worker(url);
  PY.worker.onmessage = (ev) => { const w = PY.wait.get(ev.data.id); if (w) { PY.wait.delete(ev.data.id); clearTimeout(w.timer); w.done(ev.data); } };

function pyPost(cmd, args, ms) {
  return new Promise((resolve) => {
    const id = ++PY.seq;
    const timer = setTimeout(() => {

      PY.worker.terminate(); PY.wait.forEach((w) => { clearTimeout(w.timer); w.done({ ok: false, value: 'restarted' }); }); PY.wait.clear();
      pyBoot();
      resolve({ ok: false, timeout: true });

    PY.wait.set(id, { done: resolve, timer });
    PY.worker.postMessage({ id, cmd, args });

    // A sorted result must also hold on the same hidden rows stored backwards, so ties can't pass by luck.
    if (r.status === 'pass' && q.ordered && !q.noflip && DATASETS[k].hidden) {

  if (tests.every((x) => x.status === 'error' && errKey(x.err) === errKey(tests[0].err))) tests.forEach((x, k) => { if (k) x.same = true; });

    $('#clockLabel').textContent = t('timeSpent');

}

    $('#gradeMarks').innerHTML = QUESTIONS.map((q, k) => k < i ? finalMark(k) : `<span class="st ${k === i ? 'cur' : ''}">${k + 1}</span>`).join('');

    catch (e) { S.final[i] = { passed: 0, raw: 0, total: DATASETS.length, tests: DATASETS.map(() => ({ status: 'error', err: { type: 'EngineError', msg: 'Grading failed for this challenge.', line: null }, got: null })), rule: null, code: S.codes[i] }; }
    await pause();
  }
  $('#gradeArc').style.strokeDashoffset = '0';
  S.submitted = true; S.grading = false;
  storeClear();
  S.payload = SHEET && S.code ? resultPayload() : null; S.send = 'sending';
  renderResults();
  deliver();
}
function finalState(i) { const f = S.final[i]; return f.passed === f.total ? 'pass' : f.passed === 0 ? 'fail' : 'partial'; }
function finalMark(i) {
  const s = finalState(i);
  return s === 'pass' ? `<span class="st ok">${icon('i-check')}</span>` : `<span class="st ${s === 'partial' ? 'half' : 'no'}">${i + 1}</span>`;
}
function earned(i) { const f = S.final[i]; return f && f.total ? QUESTIONS[i].points * f.passed / f.total * helpMult(i) : 0; }
/* One line on what went wrong: the first failing test, the broken rule, or the help that cost points. */
function mistakeText(i) {
  const q = QUESTIONS[i], f = S.final[i];
  if (!written(f.code, q)) return t('mNone');
  if (f.rule) return t('ruleBanner', { rule: ruleMsg(q), raw: f.raw, total: f.total });
  const k = f.tests.findIndex((x) => x.status !== 'pass');
  if (k >= 0) {
    const x = f.tests[k];
    const why = x.status === 'error' ? errLine(x.err) : ((LANG === 'ar' ? x.whyAr : x.why) || x.why || t('wrongResult'));
    return t('mHidden', { why, ds: dsName(k) });
  }
  return S.solCost[i] ? t('mHelp', { what: t('mSol') }) : S.hintCost[i] ? t('mHelp', { what: t('mHint') }) : '';
}
const written = (code, q) => code.replace(/#.*$/gm, '').trim() !== q.starter.replace(/#.*$/gm, '').trim();
/* A plain-words level for the score. */
function verdict(pct) {
  if (pct >= 90) return { label: t('v90'), color: 'var(--ok)', text: t('v90t') };
  if (pct >= 70) return { label: t('v70'), color: 'var(--ok)', text: t('v70t') };
  if (pct >= 50) return { label: t('v50'), color: 'var(--accent)', text: t('v50t') };
  return { label: t('v0'), color: 'var(--bad)', text: t('v0t') };
}
function groupStats() {
  return [...new Set(QUESTIONS.map(groupOf))].map((g) => {
    const ids = QUESTIONS.map((q, i) => i).filter((i) => groupOf(QUESTIONS[i]) === g);
    const max = ids.reduce((a, i) => a + QUESTIONS[i].points, 0), got = ids.reduce((a, i) => a + earned(i), 0);
    return { g, ids, pct: max ? Math.round(got / max * 100) : 0 };
  });
}
function summaryText() {
  const total = QUESTIONS.reduce((a, q, i) => a + earned(i), 0), M = maxPts();
  const tp = S.final.reduce((a, f) => a + f.passed, 0), tt = S.final.reduce((a, f) => a + f.total, 0);
  const groups = groupStats(), v = verdict(total / M * 100);
  return [
    `Occulenz · pandas · ${stageLabel()} · ${S.name}`,
    t('sumScore', { s: num(total), m: M, p: Math.round(total / M * 100), v: v.label }),
    t('sumTime', { t: fmt(S.timeUsed) }) + (S.duration ? t('ofLimit', { t: fmt(S.duration) }) : t('noLimitNote')) + (S.auto ? t('autoNote') : ''),
    t('sumTests', { p: tp, t: tt }),
    '',
    t('sumTopics') + groups.map((x) => `${groupName(x.g)} ${x.pct}%`).join(' · '),
    '',
    ...QUESTIONS.map((q, i) => t('sumLine', { n: String(i + 1).padStart(2, ' '), title: Q(q, 'title'), topic: Q(q, 'topic'), p: S.final[i].passed, t: S.final[i].total, e: num(earned(i)), m: q.points })
      + (S.final[i].rule ? ` (${t('ruleNot')})` : '') + (S.solCost[i] ? ` (${t('usedSol')})` : S.hintCost[i] ? ` (${t('usedHint')})` : '') + (written(S.final[i].code, q) ? '' : ` ${t('noQuery')}`)),
    t('sumHelp', { h: S.hintCost.filter(Boolean).length, s: S.solCost.filter(Boolean).length }),
    '',
    groups.some((x) => x.pct < 100) ? t('sumReview') + groups.filter((x) => x.pct < 100).sort((a, b) => a.pct - b.pct).map((x) => groupName(x.g)).join(LANG === 'ar' ? '، ' : ', ') : t('sumAll')
  ].join('\n');
}
function renderResults() {
  const total = QUESTIONS.reduce((a, q, i) => a + earned(i), 0), M = maxPts();
  const tp = S.final.reduce((a, f) => a + f.passed, 0), tt = S.final.reduce((a, f) => a + f.total, 0);
  const solved = S.final.filter((f) => f.passed === f.total).length;
  const toReview = QUESTIONS.length - solved;
  const groups = groupStats(), v = verdict(total / M * 100);
  const weak = groups.filter((x) => x.pct < 100).sort((a, b) => a.pct - b.pct);
  const order = QUESTIONS.map((q, i) => i).sort((a, b) => (earned(a) / QUESTIONS[a].points) - (earned(b) / QUESTIONS[b].points) || a - b);
  const nx = STAGE.next;
  $('#grading').hidden = true;
  const box = $('#final'); box.hidden = false;
  box.innerHTML = `<div class="res">
    ${S.payload ? '<div class="card sendbox status" id="sendBox" role="status"></div>' : ''}
    <div class="resgrid">
      <div class="scorecard glow">
        <div class="sc-top"><span class="ico">${icon('i-spark')}</span><div style="min-width:0"><b>${esc(S.name)}</b><p class="muted" style="font-size:12.5px">${esc(stageLabel())} · pandas${S.auto ? t('atLimit') : ''}</p></div><span class="muted" style="margin-inline-start:auto;font-size:12.5px;white-space:nowrap">${t('used', { t: fmt(S.timeUsed) })}</span></div>
        <div class="sc-stats">
          <div><span class="bign" style="font-size:22px">${solved}<small>${t('solvedOf', { n: QUESTIONS.length }).replace(/\s*\S+$/, '')}</small></span><p>${t('solvedL')}</p></div>
          <div><span class="bign" style="font-size:22px">${tp}<small>${LANG === 'ar' ? 'من ' + tt : '/ ' + tt}</small></span><p>${t('testsPassed')}</p></div>
          <div><span class="bign" style="font-size:22px">${toReview}</span><p>${t('toReview')}</p></div>
        </div>
        <div class="sc-bar"><i class="stripes" style="width:${(total / M * 100).toFixed(1)}%"></i></div>
        <span class="bign" style="font-size:64px">${num(total)}<small style="font-size:16px">${t('points', { n: M })}</small></span>
        <span class="verdict"><i style="background:${v.color}"></i>${esc(v.label)}</span>
        <p class="muted" style="font-size:13.5px;margin-top:-12px">${esc(v.text)}</p>
      </div>
      <div class="card pad">
        <span class="lab">${t('byChallenge')}</span>
        <div class="marks left">${QUESTIONS.map((q, i) => finalMark(i)).join('')}</div>
        <span class="lab">${t('byTopic')}</span>
        <div class="topics">${groups.map((x) => `<div><span>${esc(groupName(x.g))}</span><span class="b"><i class="${x.pct === 100 ? 'stripes' : ''}" style="width:${x.pct}%;${x.pct === 100 ? '' : 'background:var(--accent)'}"></i></span><b>${x.pct}%</b></div>`).join('')}</div>
      </div>
    </div>
    <div class="rq">
      <span class="lab">${weak.length ? t('workNext') : t('workNextAll')}</span>
      ${weak.length ? `<div class="recs">${weak.map((x) => {
        const r = STAGE.recs[x.g], missed = x.ids.filter((i) => finalState(i) !== 'pass').map((i) => Q(QUESTIONS[i], 'title'));
        return `<div class="rec"><span class="pct">${x.pct}% · ${esc(groupName(x.g))}</span><p>${esc(L(r))}</p>${missed.length ? `<p>${esc(t('missed', { list: missed.join(LANG === 'ar' ? '، ' : ', ') }))}</p>` : ''}<span class="lab" style="margin-top:4px">${t('practise')}</span><ul>${r.links.map((l) => `<li><a href="${l.href}" target="_blank" rel="noopener" dir="ltr">${esc(l.name)}</a></li>`).join('')}</ul></div>`;
      }).join('')}</div>` : `<div class="rec"><p>${esc(t('allPassed', { next: L(nx) }))}${nx.href ? ` <a href="${nx.href}" target="_blank" rel="noopener">↗</a>` : ''}</p></div>`}
    </div>
    <div class="rq">
      <span class="lab">${t('reviewT')}</span>
      ${(() => {
        // Only what needs another look: anything short of full points. Short on purpose: the mistake, how to think, the query.
        const ids = order.filter((i) => earned(i) < QUESTIONS[i].points - 0.001);
        if (!ids.length) return `<div class="rec"><p>${t('reviewNone')}</p></div>`;
        return ids.map((i, n) => {
          const q = QUESTIONS[i], f = S.final[i];
          const used = S.solCost[i] ? ' · ' + t('usedSol') : S.hintCost[i] ? ' · ' + t('usedHint') : '';
          return `<details class="rqd"${n === 0 ? ' open' : ''}><summary>${finalMark(i)}<span class="nm"><b>${esc(Q(q, 'title'))}</b><small>${esc(Q(q, 'topic') + used)}</small></span><span class="pp">${t('cardPts', { e: num(earned(i)), m: q.points })}</span><span class="chev">${icon('i-down')}</span></summary>
            <div class="rq-body">
              <div class="full mistake"><span class="lab">${t('yourMistake')}</span><p>${esc(mistakeText(i))}</p></div>
              <div class="full"><span class="lab">${t('howThink')}</span><ol class="think" style="margin-top:8px">${Q(q, 'walk').think.map((x) => `<li><span>${esc(x)}</span></li>`).join('')}</ol></div>
              <div><span class="lab">${t('yourQuery')}</span>${written(f.code, q) ? `<pre class="codeblock">${esc(f.code)}</pre>` : `<p class="muted" style="margin-top:6px">${t('noQuery')}</p>`}</div>
              <div><span class="lab">${t('reference')}</span><pre class="codeblock">${esc(q.solution)}</pre></div>
            </div></details>`;
        }).join('');
      })()}
    </div>
    <div class="card copy">
      <span class="lab">${t('summary')}</span>
      <textarea id="summary" readonly aria-label="${t('summary')}"></textarea>
      <div class="row"><button class="btn p" id="copyBtn" type="button">${icon('i-copy')}${t('copy')}</button><button class="btn" id="againBtn" type="button">${t('again')}</button><span class="muted" id="copyMsg" role="status" style="font-size:13px"></span></div>
    </div>
  </div>`;
  $('#summary').value = summaryText();
  paintSend();
  $('#copyBtn').onclick = async () => {
    const ta = $('#summary'), msg = $('#copyMsg');
    try { await navigator.clipboard.writeText(ta.value); msg.textContent = t('copied'); }
    catch (e) { ta.focus(); ta.select(); msg.textContent = t('pressCopy'); }
  };
  $('#againBtn').onclick = () => { S.submitted = false; $('#name').value = S.name; show('start'); renderStartTexts(); };
}

/* ---------- Light / Dark ---------- */
const THEME_KEY = 'occ-pandas:theme';
function currentTheme() {
  const th = document.documentElement.dataset.theme;
  if (th === 'light' || th === 'dark') return th;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function paintSwitches() { const th = currentTheme(); document.querySelectorAll('.tsw button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.t === th)); }
function applyTheme(th, save) {
  document.documentElement.dataset.theme = th; document.documentElement.style.colorScheme = th;
  if (save) { try { localStorage.setItem(THEME_KEY, th); } catch (e) {} }
  paintSwitches();
}
function initTheme() {
  document.querySelectorAll('.tsw button').forEach((b) => b.addEventListener('click', () => applyTheme(b.dataset.t, true)));
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
  if (saved === 'light' || saved === 'dark') applyTheme(saved, false); else paintSwitches();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintSwitches);
  new MutationObserver(paintSwitches).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
}

/* ---------- Wiring ---------- */
function wire() {
  initTheme();
  document.querySelectorAll('.lsw button').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.l, true)));
  $('#runBtn').addEventListener('click', runOnly);
  $('#testBtn').addEventListener('click', runTests);
  $('#tabOut').addEventListener('click', () => setTab('out'));
  $('#tabTests').addEventListener('click', () => setTab('tests'));
  $('#tabTask').addEventListener('click', () => setHelp('task'));
  $('#tabExplain').addEventListener('click', () => setHelp('explain'));
  $('#tabHint').addEventListener('click', () => setHelp('hint'));
  $('#tabSolution').addEventListener('click', () => setHelp('solution'));
  $('#prevBtn').addEventListener('click', () => go(S.current - 1));
  $('#nextBtn').addEventListener('click', () => go(S.current + 1));
  $('#closeBtn').addEventListener('click', closePanel);
  $('#varsToggle').addEventListener('click', () => { S.varsOpen = $('.sheet .vars').classList.contains('folded'); setVarsOpen(S.varsOpen); });
  $('#scrim').addEventListener('click', closePanel);
  $('#submitBtn').addEventListener('click', openConfirm);
  $('#keepBtn').addEventListener('click', closeConfirm);
  $('#doSubmitBtn').addEventListener('click', () => submitQuiz(false));
  $('#confirm').addEventListener('click', (e) => { if (e.target.id === 'confirm') closeConfirm(); });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!$('#confirm').hidden) { closeConfirm(); return; }
    // Esc inside the editor closes suggestions / prepares Tab-out; elsewhere it closes the panel.
    if (S.open && !(e.target.closest && e.target.closest('.CodeMirror'))) closePanel();
  });
  $('#resetBtn').addEventListener('click', () => {
    const b = $('#resetBtn');
    if (!resetArm) {
      resetArm = 1; b.lastChild.textContent = t('clickAgain');
      setTimeout(() => { if (resetArm) { resetArm = 0; b.lastChild.textContent = t('reset'); } }, 3000);
      return;
    }
    resetArm = 0; b.lastChild.textContent = t('reset');
    S.codes[S.current] = QUESTIONS[S.current].starter; S.runs[S.current] = null; S.outs[S.current] = null;
    edSet(S.codes[S.current]); $('#fname').classList.remove('dirty');
    renderOut(); renderTests(); renderHead(); renderBoard(); storeSave();
  });
  window.addEventListener('resize', sizeEditor);
  buildEditor();
}

wire();
let savedLang = null;
try { savedLang = localStorage.getItem(LANG_KEY); } catch (e) {}
LANG = savedLang === 'ar' ? 'ar' : 'en';
document.documentElement.lang = LANG; document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
applyStatic();
initStart();
show('start');
</script>
